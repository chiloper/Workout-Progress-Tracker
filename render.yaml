services:
  - type: web
    name: workout-tracker-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_EMAIL
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 24.12.0